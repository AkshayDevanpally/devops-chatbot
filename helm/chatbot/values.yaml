# Defaults. Environment files override only what differs. The image tag is set by the
# pipeline/script (--set image.tag=<git sha>), so the same image is promoted dev -> qa -> prod.
env: dev
host: dev.chatbot.local
theme: teal

image:
  registry: localhost:5000
  tag: dev
  pullPolicy: IfNotPresent

model: qwen2.5:0.5b
ollamaUrl: http://ollama.ai.svc.cluster.local:11434
# Private Prometheus behind the Pulse page (k8s/platform/50-prometheus.yaml). "" disables Pulse data.
prometheusUrl: http://prometheus.monitoring.svc.cluster.local:9090
cookieSecure: true           # uid cookie only sent over HTTPS (needs tls.enabled)

# Secret created by scripts/05-secrets.sh (later: External Secrets Operator).
existingSecret: chat-api-secrets

api:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    cpuPercent: 70

ui:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

pdb:
  enabled: false

# Phase 6 burst: extra chat-api pods on the AWS node (prod only). Never set by hand in values files:
# scripts/06-deploy.sh turns it on while a burst node is Ready, scripts/13-burst.sh on bring-up.
burst:
  enabled: false
  replicas: 2
  ollamaUrl: http://ollama-burst.ai.svc.cluster.local:11434

ingress:
  className: traefik

# HTTPS via cert-manager (scripts/08-tls.sh installs it and the local CA issuer).
tls:
  enabled: true
  clusterIssuer: chatbot-local-ca
  hstsSeconds: 86400           # 1 day: short while the CA is local; raise once certs are public
