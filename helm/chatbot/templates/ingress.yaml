apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot
  labels: {{- include "chatbot.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: chat-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: ui, port: { name: http } } }
