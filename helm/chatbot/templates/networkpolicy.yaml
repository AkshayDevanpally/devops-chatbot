# Narrow allows on top of the namespace's default-deny (k8s/platform/20-default-deny.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-ui-and-api
  labels: {{- include "chatbot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [ui, api] }
  policyTypes: [Ingress]
  ingress:
    # Only the Traefik ingress controller may reach the pods.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8080 }, { port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  labels: {{- include "chatbot.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: api } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ai } }
          podSelector:
            matchExpressions:   # ollama-burst runs on the AWS node (Phase 6)
              - { key: app.kubernetes.io/name, operator: In, values: [ollama, ollama-burst] }
      ports: [{ port: 11434 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
      ports: [{ port: 5432 }]
    # Fixed queries for the Pulse page.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 9090 }]
---
# Only Prometheus may read the API's metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-prometheus
  labels: {{- include "chatbot.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 9100 }]
