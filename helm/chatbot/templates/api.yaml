apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-api
  labels: {{- include "chatbot.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  labels: {{- include "chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/component: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "chatbot.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: chat-api
      automountServiceAccountToken: false
      securityContext:
        {{- include "chatbot.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # Schema migration before the app starts (advisory-locked, idempotent).
        - name: migrate
          image: "{{ .Values.image.registry }}/chat-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.migrate"]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          securityContext: {{- include "chatbot.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: chat-api
          image: "{{ .Values.image.registry }}/chat-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env:
            - { name: APP_ENV, value: {{ .Values.env | quote }} }
            - { name: OLLAMA_URL, value: {{ .Values.ollamaUrl | quote }} }
            - { name: PROMETHEUS_URL, value: {{ .Values.prometheusUrl | quote }} }
            - { name: MODEL, value: {{ .Values.model | quote }} }
            - { name: COOKIE_SECURE, value: {{ .Values.cookieSecure | quote }} }
          ports:
            - { name: http, containerPort: 8000 }
            - { name: metrics, containerPort: 9100 }   # not in the Service, not on the ingress
          securityContext: {{- include "chatbot.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 20
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  labels: {{- include "chatbot.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-api
  labels: {{- include "chatbot.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: chat-api }
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.cpuPercent }} }
{{- end }}
{{- if .Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-api
  labels: {{- include "chatbot.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/component: api }
{{- end }}
