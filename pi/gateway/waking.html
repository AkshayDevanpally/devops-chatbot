<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waking up · QwenOps</title>
<style>
  :root { --bg: #0b0f14; --panel: #121821; --line: #233041; --text: #e6edf3; --muted: #8b98a8; --accent: #0d9488; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(100%, 420px); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
  .brand { font-weight: 700; letter-spacing: .3px; color: var(--muted); }
  .brand span { color: var(--accent); }
  .moon { font-size: 44px; margin: 14px 0 6px; animation: bob 2.4s ease-in-out infinite; }
  h1 { font-size: 20px; margin: 6px 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 6px 0; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 18px 0 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .9s linear; }
  .small { font-size: 12px; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .moon { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">Qwen<span>Ops</span></div>
    <div class="moon" aria-hidden="true">🌙</div>
    <h1 id="title">The server was asleep. Waking it up…</h1>
    <p id="note">It saves power when nobody is chatting. This usually takes about a minute; the page reloads by itself.</p>
    <div class="bar" role="progressbar" aria-label="Waking up" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
    <p class="small" id="elapsed" aria-live="polite">0 s</p>
  </main>
<script>
  const start = Date.now(), fill = document.getElementById("fill"), el = document.getElementById("elapsed");
  fetch("/api/wake", { method: "POST" }).catch(() => {});
  async function tick() {
    const s = Math.round((Date.now() - start) / 1000);
    el.textContent = `${s} s`;
    fill.style.width = `${Math.min(95, (s / 90) * 100)}%`;
    if (s > 240) {
      document.getElementById("title").textContent = "This is taking longer than usual.";
      document.getElementById("note").textContent = "Try reloading in a minute. If it still doesn't wake, the server may be off.";
    }
    if (s % 20 === 19) fetch("/api/wake", { method: "POST" }).catch(() => {});   // in case a packet was missed
    try {
      const r = await fetch("/api/status", { cache: "no-store" });
      if ((await r.json()).state === "ready") { fill.style.width = "100%"; setTimeout(() => location.reload(), 1500); return; }
    } catch { /* the server may be answering already: just keep trying */ }
    setTimeout(tick, 3000);
  }
  tick();
</script>
</body>
</html>
