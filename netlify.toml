# Phase 9: public showcase on Netlify. A static copy of the site with no backend: no request
# reaches the home server. Netlify builds from GitHub on every push to master.
# Local check: make showcase-preview

[build]
  command = "python3 -I scripts/netlify-build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.13"
  # "on" once the routes below exist (scripts/21-public-chat.sh netlify): the pages then use the home
  # server for real (chat, Pulse, Capacity, Backups view, Pipeline, Be a Dev); "off" = static showcase.
  PUBLIC_LIVE = "on"

# The same security headers nginx sends at home (app-ui/nginx/default.conf), plus HSTS.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/theme.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/journal/journal.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/showcase/*"
  [headers.values]
    Cache-Control = "no-cache"

# --- public chat: generated by scripts/21-public-chat.sh netlify ---
# Netlify signs each request with QWENOPS_PROXY_SECRET (set in Netlify); the Pi refuses anything unsigned.
[[redirects]]
  from = "/api/chat"
  to = "https://qwenops.tail4e3f00.ts.net/api/chat"
  status = 200
  force = true
  signed = "QWENOPS_PROXY_SECRET"

