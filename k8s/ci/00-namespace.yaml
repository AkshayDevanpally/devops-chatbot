# ci: the Jenkins controller. Builds do NOT run here (see scripts/09a-jenkins-agent.sh):
# image builds need Docker, which the "restricted" policy rightly forbids in pods.
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    chatbot.io/tier: shared
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: ci
spec:
  hard:
    # Jenkins (1536Mi) + pipeline-events (96Mi, Phase 8); a third pod for a restart next to them.
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 2Gi
    pods: '3'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ci
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: ci
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
