# pipeline-events (Phase 8): live Jenkins builds for the Pipeline page and "Be a Dev" colour deploys.
# Code: ci/pipeline-events/pipeline_events.py (ConfigMap pipeline-events-code, scripts/09-jenkins.sh).
# chat-api (internet-facing) calls this; only chat-api may reach it, and it may only reach Jenkins.
# It signs in to Jenkins as pipeline-viewer (read builds, start jobs; can't approve prod). No Kubernetes access.
apiVersion: v1
kind: ServiceAccount
metadata: { name: pipeline-events, namespace: ci }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-events
  namespace: ci
  labels: { app.kubernetes.io/name: pipeline-events }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: pipeline-events } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pipeline-events }
    spec:
      serviceAccountName: pipeline-events
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        appArmorProfile: { type: Localhost, localhostProfile: k8s-chatbot }
      containers:
        - name: pipeline-events
          image: python:3.13.17-alpine3.24
          command: ["python", "-I", "-u", "/app/pipeline_events.py"]
          env:
            - { name: JENKINS_URL, value: "http://jenkins.ci.svc.cluster.local:8080" }
            - { name: JENKINS_USER, value: pipeline-viewer }
            - name: JENKINS_PASSWORD     # only this one key of jenkins-secrets
              valueFrom: { secretKeyRef: { name: jenkins-secrets, key: pipeline-viewer-password } }
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
      volumes:
        - name: code
          configMap: { name: pipeline-events-code }
---
apiVersion: v1
kind: Service
metadata: { name: pipeline-events, namespace: ci }
spec:
  selector: { app.kubernetes.io/name: pipeline-events }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: pipeline-events-allow, namespace: ci }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: pipeline-events } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { chatbot.io/tier: app } }
          podSelector: { matchLabels: { app.kubernetes.io/component: api } }
      ports: [{ port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: jenkins } } }]
      ports: [{ port: 8080 }]
