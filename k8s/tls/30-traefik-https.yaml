# Send every plain-HTTP request to HTTPS (301 permanent redirect).
# k3s applies this to its bundled Traefik chart and restarts Traefik.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
