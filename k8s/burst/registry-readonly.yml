# Read-only copy of the home image registry for the AWS burst node (Phase 6).
# Started by scripts/13-burst.sh once wg0 is up, and listens only on the tunnel address
# 10.200.0.1:5000, sharing the registry-data volume read-only. Nothing can be pushed through it.
version: 0.1
log:
  level: warn
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  maintenance:
    uploadpurging: { enabled: false }   # volume is mounted read-only
    readonly: { enabled: true }
http:
  addr: :5000
