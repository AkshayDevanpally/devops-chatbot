# Local Postgres for all three environments. It stays here for good: AWS burst nodes (Phase 6)
# reach it through the WireGuard tunnel (Phase 5), never a copy in AWS.
# Secret `postgres-secrets` is created by scripts/05-secrets.sh, never committed.
apiVersion: v1
kind: ServiceAccount
metadata: { name: postgres, namespace: data }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: data }
data:
  10-create-envs.sh: |
    #!/bin/sh
    # One database + one login role per environment; no role can open another env's database.
    set -eu
    for env in dev qa prod; do
      var="CHAT_$(echo "$env" | tr a-z A-Z)_PASSWORD"
      eval pw="\$$var"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<SQL
    CREATE ROLE chat_${env} LOGIN PASSWORD '${pw}';
    CREATE DATABASE chat_${env} OWNER chat_${env};
    REVOKE ALL ON DATABASE chat_${env} FROM PUBLIC;
    SQL
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
        appArmorProfile: { type: Localhost, localhostProfile: k8s-chatbot }   # scripts/01a-apparmor.sh
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "shared_buffers=256MB", "-c", "effective_cache_size=512MB", "-c", "max_connections=60",
                 "-c", "password_encryption=scram-sha-256"]
          envFrom: [{ secretRef: { name: postgres-secrets } }]
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 20
            initialDelaySeconds: 30
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: init, configMap: { name: postgres-init, defaultMode: 0555 } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: data }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-allow, namespace: data }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { chatbot.io/tier: app } }
          podSelector: { matchLabels: { app.kubernetes.io/component: api } }
      ports: [{ port: 5432 }]
