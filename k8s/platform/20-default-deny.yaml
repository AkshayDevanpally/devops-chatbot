# Zero-trust baseline: deny all traffic in and out, then allow DNS.
# Each workload adds its own narrow allow rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: chatbot-dev
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
