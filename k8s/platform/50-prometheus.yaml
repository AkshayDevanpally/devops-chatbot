# Private Prometheus for the Pulse page. Not on the ingress: only chat-api pods may query it,
# and the browser only ever sees the fixed results chat-api returns from /api/pulse.
# Scrapes: chat-api metrics (port 9100) in the app namespaces, plus kubelet resource metrics
# (CPU/memory per container and for the node). Data lives 24 h in an emptyDir: a restart
# clears history, which is fine for a live view and keeps the disk footprint fixed.
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: monitoring }
automountServiceAccountToken: false   # mounted only on the Prometheus pod below
---
# Read-only and narrow: find the node and read kubelet /metrics/*. Deliberately NOT
# nodes/proxy, which is broader than it looks (it can reach kubelet exec endpoints).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-pulse }
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-pulse }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-pulse }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
# Pod discovery only in the three app namespaces (a Role each, not cluster-wide).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus-discovery, namespace: chatbot-dev }
rules: [{ apiGroups: [""], resources: [pods], verbs: [list, watch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus-discovery, namespace: chatbot-dev }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus-discovery, namespace: chatbot-qa }
rules: [{ apiGroups: [""], resources: [pods], verbs: [list, watch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus-discovery, namespace: chatbot-qa }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus-discovery, namespace: chatbot-prod }
rules: [{ apiGroups: [""], resources: [pods], verbs: [list, watch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus-discovery, namespace: chatbot-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: monitoring }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 30s

    # Alerts (rules in alerts.yml below) go to Alertmanager, which sends them to your phone through
    # ntfy (k8s/platform/55-alerting.yaml, make alerts).
    rule_files: [/etc/prometheus/alerts.yml]
    alerting:
      alertmanagers:
        - static_configs: [{ targets: ["alertmanager.monitoring.svc.cluster.local:9093"] }]

    scrape_configs:
      # Request, chat and token metrics from every chat-api pod.
      - job_name: chat-api
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [chatbot-dev, chatbot-qa, chatbot-prod] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # CPU + memory per container and for the node (small endpoint, cheap to scrape).
      - job_name: kubelet
        scheme: https
        metrics_path: /metrics/resource
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        tls_config: { insecure_skip_verify: true }   # k3s kubelet serves a self-signed certificate
        kubernetes_sd_configs: [{ role: node }]
        # AWS burst nodes carry the node label qwenops.io/cloud=aws; it becomes cloud="aws" on every
        # series, which is how the Capacity page keeps local and AWS numbers apart.
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_qwenops_io_cloud]
            target_label: cloud

      # Only the host's total CPU cores and memory, for the "% of host" tiles.
      - job_name: kubelet-capacity
        scheme: https
        metrics_path: /metrics/cadvisor
        scrape_interval: 60s
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        tls_config: { insecure_skip_verify: true }
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_qwenops_io_cloud]
            target_label: cloud
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: machine_(cpu_cores|memory_bytes)
            action: keep

      # Backup health from backup-ops (last success and last result per kind), for the alerts.
      - job_name: backup-ops
        scrape_interval: 60s
        static_configs: [{ targets: ["backup-ops.data.svc.cluster.local:8080"] }]

  # Each alert says what is wrong and what to do. Home numbers exclude AWS burst nodes (cloud="aws").
  alerts.yml: |
    groups:
      - name: home-server
        rules:
          - alert: HostMemoryCritical
            expr: sum(node_memory_working_set_bytes{cloud!="aws"}) / sum(machine_memory_bytes{cloud!="aws"}) > 0.9
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "Home server memory above 90% ({{ $value | humanizePercentage }})"
              description: "Kubernetes starts evicting pods below 300 MB free. Check Pulse > Pods; consider make burst-up."
          - alert: HostCpuSaturated
            expr: sum(rate(node_cpu_usage_seconds_total{cloud!="aws"}[5m])) / sum(machine_cpu_cores{cloud!="aws"}) > 0.9
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "Home server CPU above 90% for 15 minutes ({{ $value | humanizePercentage }})"
              description: "Chats get slower. If prod is at 3/3 API pods, bursting to AWS helps (make burst-up)."
      - name: prod-chat
        rules:
          - alert: ChatApiDown
            expr: absent(up{job="chat-api",namespace="chatbot-prod"} == 1)
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "No prod chat-api pod is up"
              description: "The chatbot is down. Check: kubectl -n chatbot-prod get pods; make logs ENV=prod."
          - alert: ChatsFailing
            expr: |
              sum(rate(chat_requests_total{namespace="chatbot-prod",outcome="model_error"}[5m]))
                / sum(rate(chat_requests_total{namespace="chatbot-prod",outcome!="rate_limited"}[5m])) > 0.05
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $value | humanizePercentage }} of prod chats fail"
              description: "The model errors or times out. Check Ollama: kubectl -n ai logs deploy/ollama."
          - alert: ServerErrors
            expr: |
              sum(rate(http_requests_total{namespace="chatbot-prod",status_class="5xx"}[5m]))
                / sum(rate(http_requests_total{namespace="chatbot-prod"}[5m])) > 0.05
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $value | humanizePercentage }} of prod requests return 5xx"
              description: "Check: make logs ENV=prod."
          - alert: BurstRecommended
            expr: |
              count(up{job="chat-api",namespace="chatbot-prod",pod!~"chat-api-burst-.*"} == 1) >= 3
              and histogram_quantile(0.95, sum by (le) (rate(chat_first_token_seconds_bucket{namespace="chatbot-prod"}[5m]))) > 15
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Prod is at its home limit (3/3 API pods) and the first word takes over 15 s"
              description: "Add AWS capacity: make burst-up (about 0.05-0.08 USD an hour; it stops itself when idle)."
          - alert: ModelSaturated
            expr: sum(chat_active_streams{namespace="chatbot-prod"}) > 2
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "More than 2 prod chats streaming for 5 minutes: a queue is forming"
              description: "Ollama answers 2 at a time. Expect slow replies; consider make burst-up."
      - name: backups
        rules:
          - alert: BackupOpsDown
            expr: absent(up{job="backup-ops"} == 1)
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "backup-ops is down: backup status and alerts are blind"
              description: "Check: kubectl -n data get pods -l app.kubernetes.io/name=backup-ops; make backups."
          - alert: BackupFailed
            expr: backup_last_run_failed == 1
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "The last {{ $labels.kind }} run failed"
              description: "Open Pulse > Backups and expand the failed run to read its log."
          - alert: BackupOverdue
            expr: |
              (time() - backup_last_success_timestamp_seconds{kind="backup"}) > 26 * 3600
              or (time() - backup_last_success_timestamp_seconds{kind="offsite"}) > 84 * 3600
              or (time() - backup_last_success_timestamp_seconds{kind="restore-test"}) > 8 * 86400
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "No successful {{ $labels.kind }} for too long"
              description: "Backup older than 26 h, off-site copy older than 3.5 days, or restore test older than 8 days. See Pulse > Backups."
      - name: aws
        rules:
          - alert: BurstNodeRunningLong
            expr: count(machine_cpu_cores{cloud="aws"}) > 0
            for: 4h
            labels: { severity: warning }
            annotations:
              summary: "An AWS burst node has been running for over 4 hours"
              description: "It costs money while it runs. If it isn't needed: make burst-down."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true   # needed for discovery + kubelet; RBAC above is read-only
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
        appArmorProfile: { type: Localhost, localhostProfile: k8s-chatbot }   # scripts/01a-apparmor.sh
      containers:
        - name: prometheus
          # Check https://github.com/prometheus/prometheus/releases before bumping.
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=300MB
          ports: [{ name: http, containerPort: 9090 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 20
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: prometheus-allow, namespace: monitoring }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  policyTypes: [Ingress, Egress]
  ingress:
    # Only chat-api pods may query Prometheus (for /api/pulse).
    - from:
        - namespaceSelector: { matchLabels: { chatbot.io/tier: app } }
          podSelector: { matchLabels: { app.kubernetes.io/component: api } }
      ports: [{ port: 9090 }]
  egress:
    # Scrape chat-api metrics.
    - to:
        - namespaceSelector: { matchLabels: { chatbot.io/tier: app } }
          podSelector: { matchLabels: { app.kubernetes.io/component: api } }
      ports: [{ port: 9100 }]
    # Send alerts to Alertmanager.
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alertmanager } }
      ports: [{ port: 9093 }]
    # Backup health from backup-ops.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: backup-ops } }
      ports: [{ port: 8080 }]
    # Kubernetes API (discovery) and the kubelet (resource metrics). Both listen on the
    # node's own IP, so allow only those ports, only to private ranges.
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
      ports: [{ port: 443 }, { port: 6443 }, { port: 10250 }]
