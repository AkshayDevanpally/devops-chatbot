# Sized for a 16 GB / 4-core host. Quotas define what "local hardware is full" means.
# limits.cpu leaves room for one extra pod during a rolling update (maxSurge: 1):
#   dev/qa: api 500m + ui 100m + surge 500m + 100m = 1.2 -> 1500m
#   prod:   3 api x 1 + 2 ui x 100m (HPA at max) + surge 1 + 100m = 4.3 -> 5
# CPU limits are ceilings, not reservations; scheduling uses requests.cpu.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-prod
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 768Mi
    limits.cpu: '5'
    limits.memory: 1536Mi
    pods: '10'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-qa
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 768Mi
    pods: '5'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-dev
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 768Mi
    pods: '5'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: ai
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1536Mi
    limits.cpu: '4'
    limits.memory: 4608Mi       # Ollama 4Gi + model-pull init container 512Mi
    pods: '2'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: data
spec:
  hard:
    # Postgres (768Mi) + nightly backup job (256Mi) + weekly restore test (384Mi), all at once.
    requests.cpu: 400m
    requests.memory: 640Mi
    limits.cpu: '2'
    limits.memory: 1536Mi
    pods: '3'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: '1'
    limits.memory: 512Mi
    pods: '2'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: chatbot-dev
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
    max:
      cpu: '2'
      memory: 1Gi
---
apiVersion: v1
