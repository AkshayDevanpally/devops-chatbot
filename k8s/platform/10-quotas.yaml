apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: chatbot-dev
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
    max:
      cpu: '2'
      memory: 1Gi
