# Sized for a 16 GB / 4-core host. Quotas define what "local hardware is full" means.
# limits.cpu leaves room for one extra pod during a rolling update (maxSurge: 1):
#   dev/qa: api 500m + ui 100m + surge 500m + 100m = 1.2 -> 1500m
#   prod:   3 api x 1 + 2 ui x 100m (HPA at max) + surge 1 + 100m = 4.3 -> 5
# CPU limits are ceilings, not reservations; scheduling uses requests.cpu.
# Who goes first when the home server runs short (overload protection). Under memory pressure the
# kubelet evicts lower-priority pods first (among those using more than they asked for), and a pod
# that can't be scheduled may push lower-priority pods off the node.
#   qwenops-platform  Postgres, Ollama, Prometheus: everything else depends on them
#   qwenops-prod      prod chat-api and UI (helm values-prod.yaml)
#   (default, 0)      dev, qa, Jenkins, backup jobs: give way first
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: qwenops-platform }
value: 1000000
globalDefault: false
description: Shared platform pods (Postgres, Ollama, Prometheus). Evicted last.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: qwenops-prod }
value: 100000
globalDefault: false
description: Prod chat-api and UI. Ahead of dev, qa and Jenkins.
---
# Phase 6 burst pods: only for the AWS node (nodeSelector + taint toleration), counted apart from
# the home quotas. Never preempts anything.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: qwenops-burst }
value: 0
preemptionPolicy: Never
globalDefault: false
description: Pods on the AWS burst node (Phase 6). Counted by the "burst" quotas, not the home ones.
---
# AWS node: c6a.xlarge, 4 vCPU / 8 GB. 2 chat-api pods + 1 rolling-update surge.
apiVersion: v1
kind: ResourceQuota
metadata: { name: burst, namespace: chatbot-prod }
spec:
  scopeSelector:
    matchExpressions:
      - { scopeName: PriorityClass, operator: In, values: [qwenops-burst] }
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: '3'
    limits.memory: 1Gi
    pods: '3'
---
# Ollama on the AWS node + its model-pull init container.
apiVersion: v1
kind: ResourceQuota
metadata: { name: burst, namespace: ai }
spec:
  scopeSelector:
    matchExpressions:
      - { scopeName: PriorityClass, operator: In, values: [qwenops-burst] }
  hard:
    requests.cpu: '1'
    requests.memory: 1536Mi
    limits.cpu: '3'
    limits.memory: 4608Mi
    pods: '1'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-prod
spec:
  # Home pods only. Burst pods (priority class qwenops-burst, AWS node) have their own quota below,
  # so bursting never eats into what the home server is allowed to use.
  scopeSelector:
    matchExpressions:
      - { scopeName: PriorityClass, operator: NotIn, values: [qwenops-burst] }
  hard:
    requests.cpu: '1'
    requests.memory: 768Mi
    limits.cpu: '5'
    limits.memory: 1536Mi
    pods: '10'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-qa
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 768Mi
    pods: '5'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-dev
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 768Mi
    pods: '5'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: ai
spec:
  # Home pods only. Burst pods (priority class qwenops-burst, AWS node) have their own quota below,
  # so bursting never eats into what the home server is allowed to use.
  scopeSelector:
    matchExpressions:
      - { scopeName: PriorityClass, operator: NotIn, values: [qwenops-burst] }
  hard:
    requests.cpu: '1'
    requests.memory: 1536Mi
    limits.cpu: '4'
    limits.memory: 4608Mi       # Ollama 4Gi + model-pull init container 512Mi
    pods: '2'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: data
spec:
  hard:
    # Postgres (768Mi + 32Mi reload sidecar) + backup-ops (96Mi), and at once: backup job (256Mi),
    # off-site copy (256Mi), weekly restore test (384Mi).
    requests.cpu: 500m
    requests.memory: 768Mi
    limits.cpu: '3'
    limits.memory: 2Gi
    pods: '5'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: monitoring
spec:
  hard:
    # Prometheus (384Mi) + Alertmanager (96Mi) + ntfy-bridge (64Mi), with room for one restart.
    requests.cpu: 300m
    requests.memory: 384Mi
    limits.cpu: 1500m
    limits.memory: 768Mi
    pods: '4'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: chatbot-dev
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
    max:
      cpu: '2'
      memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: chatbot-qa
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
    max:
      cpu: '2'
      memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: chatbot-prod
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
    max:
      cpu: '2'
      memory: 1Gi
