# Sized for an 8 GB / 8-core host. Quotas define what "local hardware is full" means.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-prod
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 768Mi
    limits.cpu: '3'
    limits.memory: 1536Mi
    pods: '10'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: chatbot-qa
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 384Mi
    limits.cpu: '1'
    limits.memory: 768Mi
    pods: '5'
---
