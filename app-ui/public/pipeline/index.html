<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Factory</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="brand">Qwen<span>Ops</span></div>
    <nav><a href="/">Chat</a><a href="/pipeline/">Pipeline</a><a href="/dev/">Be a Dev</a><a href="/pulse/">Pulse</a><a href="/capacity/">Capacity</a><a href="/journal/">Journal</a><a href="/architecture/">Architecture</a></nav>
    <div class="env">local</div>
  </header>
  <main class="wide">
    <div class="pulse-head">
      <div>
        <h2>CI/CD factory</h2>
        <p class="note" id="mode">Connecting to Jenkins…</p>
      </div>
      <div class="pulse-controls">
        <div class="seg" role="group" aria-label="Which pipeline" id="jobs" hidden>
          <button type="button" data-job="chatbot">Delivery pipeline</button>
          <button type="button" data-job="theme-deploy">Colour deploys</button>
        </div>
        <div class="live" id="live" aria-live="polite"><i></i><span id="live-text"></span></div>
      </div>
    </div>

    <div class="runs" id="runs" aria-label="Recent runs"></div>
    <section class="run-head" id="run-head" hidden>
      <div class="run-title"><b id="run-name"></b> <span id="run-badge"></span></div>
      <div class="run-meta" id="run-meta"></div>
      <div class="waiting" id="waiting" hidden></div>
    </section>

    <div class="belt"><div class="box" id="box"></div></div>
    <div class="factory" id="factory"></div>
    <button id="run" hidden>Run demo build</button>
    <div id="drawer">
      <div class="bar"><span id="drawer-title">Logs</span><span id="drawer-close" class="link">close</span></div>
      <pre id="drawer-log"></pre>
    </div>
  </main>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script src="/pipeline/pipeline.js"></script>
</body>
</html>
