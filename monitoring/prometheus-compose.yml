# Prometheus config for Docker Compose only. Kubernetes uses k8s/platform/50-prometheus.yaml.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: chat-api
    static_configs:
      - targets: ["chat-api:9100"]
        # Same labels Kubernetes adds, so the Pulse queries work unchanged (APP_ENV=local).
        labels: { namespace: chatbot-local, pod: chat-api }
